<!DOCTYPE html>
<html lang="zh-Hans" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASMRoner - 本地播放器</title>
  <script src="/public/js/tailwindcss-3.4.17.js"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/public/css/plyr-3.7.8.css" />
  <script src="/public/js/plyr-3.7.8.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    .dark ::-webkit-scrollbar-thumb { background: #4b5563; }

    :root { --plyr-color-main: #ec4899; }

    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* 播放区封面背景模糊 */
    #playerBg { filter: blur(60px) saturate(1.3); }

    /* ========== Plyr 全局 ========== */
    .plyr { font-family: inherit; border-radius: 16px; overflow: hidden; }
    .plyr__control--overlaid { background: rgba(236,72,153,0.85) !important; backdrop-filter: blur(4px); }

    /* ========== video 模式 ======== */
    /* 视频包装区 = 封面展示区 */
    .plyr--video .plyr__video-wrapper {
      background: #0f172a !important;
      min-height: 220px;
      max-height: 340px;
    }
    /* poster 就是封面图，必须显示 */
    .plyr--video .plyr__poster {
      background-size: contain !important;
      background-color: #0f172a !important;
    }
    /* 控制栏 */
    .plyr--video .plyr__controls {
      background: linear-gradient(0deg, rgba(15,23,42,0.98) 0%, rgba(15,23,42,0.9) 100%) !important;
      padding: 12px 16px !important;
      border: none !important;
      gap: 2px;
    }
    .plyr--video .plyr__control { color: #cbd5e1 !important; }
    .plyr--video .plyr__control:hover { color: #fff !important; background: rgba(236,72,153,0.15) !important; }
    .plyr--video .plyr__control[data-plyr="play"],
    .plyr--video .plyr__control[data-plyr="pause"] { color: #ec4899 !important; }
    /* 进度条 */
    .plyr--video .plyr__progress__container { flex: 1; margin: 0 4px; }
    .plyr--video .plyr__progress input[type="range"] { --range-thumb-height: 12px; }
    .plyr--video .plyr__progress input[type="range"]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; }
    .plyr--video .plyr__progress input[type="range"]::-webkit-slider-thumb {
      width: 14px; height: 14px; margin-top: -4.5px;
      box-shadow: 0 0 0 4px rgba(236,72,153,0.2);
      background: #ec4899;
    }
    /* 时间显示 */
    .plyr--video .plyr__time {
      font-size: 13px; font-variant-numeric: tabular-nums;
      color: #94a3b8 !important; min-width: 44px;
    }
    /* 音量滑块 */
    .plyr--video .plyr__volume input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; }
    .plyr--video .plyr__volume input[type="range"]::-webkit-slider-thumb {
      width: 12px; height: 12px; margin-top: -4px;
      background: #ec4899;
    }
    /* 字幕文字 */
    .plyr__captions { font-size: 18px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
    /* 工具提示 */
    .plyr__tooltip {
      background: rgba(15,23,42,0.95) !important; color: #f1f5f9 !important;
      border-radius: 6px !important; font-size: 12px !important;
    }
  </style>
</head>

<body class="bg-gray-50 dark:bg-gray-950 h-screen w-screen overflow-hidden text-gray-700 dark:text-gray-200 font-sans transition-colors">

<div id="app" class="flex flex-col md:flex-row h-full w-full max-w-[1920px] mx-auto bg-white dark:bg-gray-900 shadow-xl overflow-hidden">

  <!-- ========== 左侧边栏 ========== -->
  <aside class="w-full md:w-[380px] lg:w-[420px] flex flex-col border-r border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900 z-20 h-full shrink-0">

    <!-- 顶部 -->
    <div class="p-4 border-b border-gray-100 dark:border-gray-800 sticky top-0 bg-white/95 dark:bg-gray-900/95 backdrop-blur z-10">
      <div class="flex items-center justify-between mb-3">
        <h1 class="font-bold text-pink-500 text-lg tracking-tight select-none">🎧 ASMRoner</h1>
        <button id="themeToggle" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition text-gray-400 hover:text-pink-500" title="切换深色模式">
          <svg id="themeIconSun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke-linecap="round"/></svg>
          <svg id="themeIconMoon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <!-- 搜索栏 -->
      <div class="relative">
        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35" stroke-linecap="round"/></svg>
        <input id="searchInput" type="text" placeholder="搜索 RJ 编号 / 标题 ..."
          class="w-full pl-9 pr-8 py-2 text-sm rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-pink-500/50 focus:border-pink-500 transition placeholder:text-gray-400">
        <button id="searchClear" class="hidden absolute right-2 top-1/2 -translate-y-1/2 p-0.5 rounded text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <!-- 目录列表 -->
    <ul id="folderList" class="flex-1 overflow-y-auto p-2 space-y-1">
      <li class="flex justify-center py-12">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-pink-500"></div>
      </li>
    </ul>

    <!-- 底部分页 -->
    <div class="p-3 border-t border-gray-100 dark:border-gray-800 flex justify-between items-center bg-gray-50 dark:bg-gray-900 text-sm">
      <button id="prevPage" class="px-3 py-1.5 rounded-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-pink-50 dark:hover:bg-pink-900/20 hover:text-pink-500 hover:border-pink-200 dark:hover:border-pink-800 transition disabled:opacity-40 disabled:cursor-not-allowed">上一页</button>
      <span id="pageInfo" class="font-mono text-gray-400 dark:text-gray-500 text-xs">1/1</span>
      <button id="nextPage" class="px-3 py-1.5 rounded-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-pink-50 dark:hover:bg-pink-900/20 hover:text-pink-500 hover:border-pink-200 dark:hover:border-pink-800 transition disabled:opacity-40 disabled:cursor-not-allowed">下一页</button>
    </div>
  </aside>

  <!-- ========== 右侧主区域 ========== -->
  <main class="flex-1 flex flex-col h-full relative z-10 bg-white dark:bg-gray-900 min-w-0">

    <!-- 播放区 -->
    <section class="bg-gray-900 relative w-full shrink-0 flex flex-col justify-center items-center p-4 md:p-6 overflow-hidden">
      <!-- 模糊背景（封面图 + 高斯模糊） -->
      <div id="playerBg" class="absolute inset-0 bg-cover bg-center opacity-50 scale-125 transition-all duration-700" style="background-image: url('');"></div>
      <div class="absolute inset-0 bg-gradient-to-b from-gray-900/30 via-gray-900/60 to-gray-900"></div>

      <!-- 播放器（Plyr poster 即封面） -->
      <div class="w-full max-w-[600px] z-20 shadow-2xl">
        <video id="player" controls playsinline crossorigin class="w-full"></video>
      </div>

      <!-- 曲目信息 -->
      <div class="mt-4 z-20 text-center px-4">
        <h3 id="mediaTitle" class="text-white font-semibold text-base md:text-lg line-clamp-1">点击左侧作品开始播放</h3>
        <p id="mediaSubtitle" class="text-gray-400 text-sm mt-1">选择一个曲目</p>
      </div>
    </section>

    <!-- 播放列表 -->
    <section class="flex-1 overflow-y-auto flex flex-col">
      <div class="px-5 py-3 border-b border-gray-100 dark:border-gray-800 sticky top-0 bg-white dark:bg-gray-900 z-10 flex items-center gap-2">
        <span id="trackCountBadge" class="px-2.5 py-0.5 bg-pink-500 text-white text-xs rounded-full font-medium">0 首</span>
        <span class="text-gray-400 text-xs">播放列表</span>
        <span id="folderMeta" class="ml-auto text-gray-400 text-xs hidden"></span>
      </div>

      <ul id="mediaList" class="p-2 space-y-0.5 pb-20">
        <li class="flex justify-center py-16 text-gray-400 text-sm">
          <div class="text-center">
            <svg class="w-12 h-12 mx-auto mb-3 text-gray-300 dark:text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            <p>点击左侧作品查看曲目列表</p>
          </div>
        </li>
      </ul>
    </section>
  </main>
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 text-sm shadow-2xl opacity-0 transition-all duration-300 pointer-events-none"></div>

<script>
(function() {
  /* ======== 常量 ======== */
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  let currentPage = 1;
  const pageSize = 20;
  let player = null;
  let currentMediaList = [];
  let currentMediaIndex = -1;
  let currentFolder = null;
  let isSearchMode = false;
  let searchQuery = '';
  let totalPages = 1;
  let subtitleMap = {};  // { 'track.mp3': ['track.vtt', 'track.mp3.vtt'] }

  /* ======== 主题切换 ======== */
  const themeToggle = $('#themeToggle');
  const iconSun = $('#themeIconSun');
  const iconMoon = $('#themeIconMoon');
  const html = document.documentElement;

  const savedTheme = localStorage.getItem('asmroner-theme');
  if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    html.classList.add('dark');
    iconSun.classList.remove('hidden');
    iconMoon.classList.add('hidden');
  }

  themeToggle.onclick = () => {
    html.classList.toggle('dark');
    const isDark = html.classList.contains('dark');
    iconSun.classList.toggle('hidden', !isDark);
    iconMoon.classList.toggle('hidden', isDark);
    localStorage.setItem('asmroner-theme', isDark ? 'dark' : 'light');
  };

  /* ======== Toast ======== */
  let toastTimer;
  function showToast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('opacity-100');
    el.classList.remove('opacity-0');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.classList.add('opacity-0'); el.classList.remove('opacity-100'); }, 2000);
  }

  /* ======== 搜索 ======== */
  const searchInput = $('#searchInput');
  const searchClear = $('#searchClear');
  let searchDebounce;

  searchInput.addEventListener('input', () => {
    const val = searchInput.value.trim();
    searchClear.classList.toggle('hidden', val === '');
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => {
      searchQuery = searchInput.value.trim();
      if (searchQuery) {
        isSearchMode = true;
        currentPage = 1;
        loadSearch(searchQuery, currentPage);
      } else {
        isSearchMode = false;
        currentPage = 1;
        loadFolders(currentPage);
      }
    }, 300);
  });

  searchClear.onclick = () => {
    searchInput.value = '';
    searchClear.classList.add('hidden');
    isSearchMode = false;
    searchQuery = '';
    currentPage = 1;
    loadFolders(currentPage);
  };

  // ESC 清空搜索
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      searchClear.click();
      searchInput.blur();
    }
  });

  /* ======== Plyr 初始化 ======== */
  player = new Plyr('#player', {
    controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'fullscreen'],
    captions: { active: true, update: true, language: 'zh' },
    fullscreen: { enabled: true, fallback: true, iosNative: true }
  });

  player.on('ended', () => {
    playNextMedia();
  });

  /* ======== 分页按钮 ======== */
  $('#prevPage').onclick = () => {
    if (currentPage > 1) {
      currentPage--;
      isSearchMode ? loadSearch(searchQuery, currentPage) : loadFolders(currentPage);
    }
  };
  $('#nextPage').onclick = () => {
    if (currentPage < totalPages) {
      currentPage++;
      isSearchMode ? loadSearch(searchQuery, currentPage) : loadFolders(currentPage);
    }
  };

  /* ======== 键盘快捷键 ======== */
  document.addEventListener('keydown', (e) => {
    // 焦点在输入框时忽略
    if (e.target.tagName === 'INPUT') return;

    switch (e.key) {
      case ' ':
        e.preventDefault();
        player.togglePlay();
        break;
      case 'ArrowLeft':
        e.preventDefault();
        if (currentMediaIndex > 0) {
          currentMediaIndex--;
          playMedia(currentFolder, currentMediaList[currentMediaIndex]);
        }
        break;
      case 'ArrowRight':
        e.preventDefault();
        if (currentMediaIndex + 1 < currentMediaList.length) {
          currentMediaIndex++;
          playMedia(currentFolder, currentMediaList[currentMediaIndex]);
        }
        break;
      case 'ArrowUp':
        e.preventDefault();
        player.increaseVolume(0.05);
        break;
      case 'ArrowDown':
        e.preventDefault();
        player.decreaseVolume(0.05);
        break;
    }
  });

  /* ======== 数据加载 ======== */
  function showListLoading() {
    $('#folderList').innerHTML = '<li class="flex justify-center py-12"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-pink-500"></div></li>';
  }

  function loadFolders(page) {
    showListLoading();
    fetch(`/api/list?page=${page}&pageSize=${pageSize}`)
      .then(res => res.json())
      .then(json => {
        if (json.code !== 200) throw new Error(json.msg);
        const data = json.data;
        totalPages = Math.max(1, Math.ceil(data.total / data.pageSize));
        renderFolders(data.infos);
        $('#pageInfo').textContent = `${data.page} / ${totalPages}`;
        $('#prevPage').disabled = data.page <= 1;
        $('#nextPage').disabled = data.page >= totalPages;
      })
      .catch(err => {
        $('#folderList').innerHTML = `<li class="text-center py-12 text-red-400 text-sm">加载失败: ${err.message}</li>`;
      });
  }

  function loadSearch(q, page) {
    showListLoading();
    fetch(`/api/search?q=${encodeURIComponent(q)}&page=${page}&pageSize=${pageSize}`)
      .then(res => res.json())
      .then(json => {
        if (json.code !== 200) throw new Error(json.msg);
        const data = json.data;
        totalPages = Math.max(1, Math.ceil(data.total / data.pageSize));
        renderFolders(data.infos);
        $('#pageInfo').textContent = `${data.page} / ${totalPages}（共 ${data.total} 条）`;
        $('#prevPage').disabled = data.page <= 1;
        $('#nextPage').disabled = data.page >= totalPages;

        if (data.total === 0) {
          $('#folderList').innerHTML = '<li class="text-center py-12 text-gray-400 text-sm">未找到匹配的作品</li>';
        }
      })
      .catch(err => {
        $('#folderList').innerHTML = `<li class="text-center py-12 text-red-400 text-sm">搜索失败: ${err.message}</li>`;
      });
  }

  /* ======== 渲染目录卡片 ======== */
  function renderFolders(folders) {
    const ul = $('#folderList');
    ul.innerHTML = '';

    if (!folders || folders.length === 0) {
      ul.innerHTML = '<li class="text-center py-12 text-gray-400 text-sm">暂无作品，请先下载</li>';
      return;
    }

    folders.forEach((folder, idx) => {
      const li = document.createElement('li');
      const coverSrc = folder.coverPath
        ? `/${folder.baseDir}/${folder.name}/${folder.coverPath}`
        : '';

      li.className = 'group cursor-pointer rounded-xl p-3 hover:bg-gray-50 dark:hover:bg-gray-800/50 transition border-2 border-transparent';
      li.dataset.folderIndex = idx;

      li.innerHTML = `
        <div class="flex gap-3 items-start">
          <div class="relative w-[3.75rem] h-[3.75rem] shrink-0 rounded-xl overflow-hidden bg-gray-100 dark:bg-gray-800 shadow-sm">
            ${coverSrc
              ? `<img src="${coverSrc}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center text-gray-300 dark:text-gray-600\\'><svg class=\\'w-7 h-7\\' fill=\\'none\\' stroke=\\'currentColor\\' viewBox=\\'0 0 24 24\\'><path d=\\'M9 18V5l12-2v13\\' stroke-linecap=\\'round\\' stroke-linejoin=\\'round\\'/><circle cx=\\'6\\' cy=\\'18\\' r=\\'3\\'/><circle cx=\\'18\\' cy=\\'16\\' r=\\'3\\'/></svg></div>'">`
              : `<div class="w-full h-full flex items-center justify-center text-gray-300 dark:text-gray-600"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>`
            }
          </div>
          <div class="flex-1 min-w-0">
            <div class="font-semibold text-gray-800 dark:text-gray-100 text-sm line-clamp-2 leading-snug group-hover:text-pink-600 dark:group-hover:text-pink-400 transition">${escapeHtml(folder.title || folder.name)}</div>
            ${folder.vas ? `<div class="text-xs text-pink-500/80 dark:text-pink-400/70 mt-0.5 truncate" title="${escapeHtml(folder.vas)}">🎙 ${escapeHtml(folder.vas)}</div>` : ''}
            <div class="flex items-center gap-2 mt-1.5 text-xs text-gray-400 dark:text-gray-500">
              <span class="bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded font-mono text-gray-500 dark:text-gray-400">${escapeHtml(folder.mediaId || '—')}</span>
              ${folder.date ? `<span>${escapeHtml(folder.date.substring(0,4)+'-'+folder.date.substring(4,6)+'-'+folder.date.substring(6,8))}</span>` : ''}
              ${folder.hasSubtitles ? '<span class="text-emerald-500 font-medium">字幕</span>' : ''}
            </div>
          </div>
          <div class="text-right shrink-0 ml-1">
            <span class="text-[11px] text-gray-300 dark:text-gray-600 font-medium">${folder.audioCount||0}首</span>
          </div>
        </div>
      `;

      li.onclick = () => onFolderClicked(folder);
      ul.appendChild(li);
    });

    highlightCurrentFolder();
  }

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  /* ======== 点击作品 ======== */
  function onFolderClicked(folder) {
    currentFolder = folder;
    highlightCurrentFolder();

    $('#mediaTitle').textContent = folder.title || folder.name;
    const metaParts = [folder.mediaId];
    if (folder.vas) metaParts.push(folder.vas);
    if (folder.date) metaParts.push(folder.date);
    if (folder.hasSubtitles) metaParts.push('含字幕');
    $('#mediaSubtitle').textContent = metaParts.join(' · ');
    $('#folderMeta').textContent = folder.mediaId || '';
    $('#folderMeta').classList.remove('hidden');
    $('#trackCountBadge').textContent = `${folder.audioCount || 0} 首`;

    // 封面
    const coverSrc = folder.coverPath ? `/${folder.baseDir}/${folder.name}/${folder.coverPath}` : '';
    if (coverSrc) {
      $('#playerBg').style.backgroundImage = `url('${coverSrc}')`;
    } else {
      $('#playerBg').style.backgroundImage = 'none';
    }

    // 筛选音频文件
    const audioExts = ['.mp3', '.wav', '.flac', '.m4a', '.ogg', '.aac'];
    const mediaFiles = folder.files.filter(f =>
      !f.isDir && audioExts.some(ext => f.name.toLowerCase().endsWith(ext))
    );

    // 建立字幕映射表
    subtitleMap = buildSubtitleMap(folder, mediaFiles);

    currentMediaList = mediaFiles;
    currentMediaIndex = -1;
    renderMediaList(folder, mediaFiles);
  }

  /* ======== 字幕映射 ======== */
  function buildSubtitleMap(folder, mediaFiles) {
    const map = {};

    // 收集所有 .vtt 文件
    const SUB_EXTENSIONS = new Set(['.vtt', '.srt', '.ass', '.ssa', '.sub']);
    const allSubFiles = folder.files.filter(f =>
      !f.isDir && SUB_EXTENSIONS.has('.' + f.name.split('.').pop().toLowerCase())
    );

    for (const mf of mediaFiles) {
      const matched = [];
      const mBase = mf.name.substring(0, mf.name.lastIndexOf('.'));

      for (const sf of allSubFiles) {
        const sfName = sf.name;

        // 规则1: track.mp3.vtt / track.mp3.srt（媒体文件名 + .字幕扩展名）
        if (sfName.startsWith(mf.name + '.')) {
          const sfExt = '.' + sfName.split('.').pop().toLowerCase();
          if (SUB_EXTENSIONS.has(sfExt)) {
            matched.push(sf);
            continue;
          }
        }

        // 规则2: track.vtt / track.srt（同 basename，不同扩展名）
        const sBase = sfName.substring(0, sfName.lastIndexOf('.'));
        if (mBase === sBase && sfName !== mf.name) {
          matched.push(sf);
        }
      }

      if (matched.length > 0) {
        map[mf.name] = matched;
      }
    }

    return map;
  }

  /* ======== 渲染曲目列表 ======== */
  function renderMediaList(folder, mediaFiles) {
    const ul = $('#mediaList');
    ul.innerHTML = '';

    if (mediaFiles.length === 0) {
      ul.innerHTML = '<li class="text-center py-16 text-gray-400 text-sm"><svg class="w-10 h-10 mx-auto mb-2 text-gray-300 dark:text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>该作品下没有音频文件</li>';
      return;
    }

    mediaFiles.forEach((file, index) => {
      const hasSubs = subtitleMap[file.name] && subtitleMap[file.name].length > 0;
      const li = document.createElement('li');
      li.className = 'flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800/50 cursor-pointer group transition border-l-[3px] border-transparent';
      li.innerHTML = `
        <span class="text-xs font-mono text-gray-300 dark:text-gray-600 w-6 text-right shrink-0 group-hover:text-pink-400 tabular-nums">${index + 1}</span>
        <svg class="w-4 h-4 text-gray-300 dark:text-gray-600 shrink-0 group-hover:text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="flex-1 text-sm text-gray-700 dark:text-gray-200 truncate group-hover:text-pink-600 dark:group-hover:text-pink-400 font-medium">${escapeHtml(file.name)}</span>
        ${hasSubs ? '<span class="text-emerald-500 text-[11px] font-medium shrink-0" title="含字幕">CC</span>' : ''}
        <span class="text-[11px] text-gray-300 dark:text-gray-600 uppercase shrink-0">${file.name.split('.').pop()}</span>
      `;
      li.onclick = () => {
        currentMediaIndex = index;
        playMedia(folder, file);
      };
      ul.appendChild(li);
    });
  }

  /* ======== 播放器控制 ======== */
  function playMedia(folder, file) {
    const base = `/${folder.baseDir}/${folder.name}/${file.path}`;

    const ext = file.name.split('.').pop().toLowerCase();
    const mimeMap = { mp3: 'audio/mpeg', wav: 'audio/wav', flac: 'audio/flac', m4a: 'audio/mp4', ogg: 'audio/ogg', aac: 'audio/aac' };

    // 从字幕映射表构建 tracks 数组
    const matchedSubs = subtitleMap[file.name] || [];
    const escName = file.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const tracks = matchedSubs.map((vf, i) => {
      // 从字幕文件名中去掉媒体文件名（含可选 . 分隔符）和字幕扩展名，得到纯 label
      let label = vf.name;
      // 去掉末尾的字幕扩展名 (.vtt/.srt/.ass/.ssa/.sub)
      const subExtIdx = label.lastIndexOf('.');
      if (subExtIdx > 0) label = label.substring(0, subExtIdx);
      // 去掉媒体文件名部分: "track.mp3" → ""  "track.mp3.chs" → ".chs"
      const nameRe = new RegExp('^' + escName + '\\.?', 'i');
      label = label.replace(nameRe, '');
      return {
        kind: 'captions',
        label: label || '中文',
        srclang: 'zh',
        src: `/${folder.baseDir}/${folder.name}/${vf.path}`,
        default: i === 0
      };
    });

    player.source = {
      type: 'video',
      title: file.name,
      sources: [{ src: base, type: mimeMap[ext] || 'audio/mpeg' }],
      poster: folder.coverPath ? `/${folder.baseDir}/${folder.name}/${folder.coverPath}` : '',
      tracks: tracks
    };
    player.play();
    updateMediaHighlight();
    $('#mediaTitle').textContent = file.name;
  }

  function updateMediaHighlight() {
    $$('#mediaList li').forEach((li, idx) => {
      if (idx === currentMediaIndex) {
        li.classList.add('bg-pink-50', 'dark:bg-pink-900/10', 'border-pink-500');
        li.classList.remove('border-transparent', 'hover:bg-gray-50', 'dark:hover:bg-gray-800/50');
        const icon = li.querySelector('svg');
        if (icon) { icon.classList.remove('text-gray-300', 'dark:text-gray-600'); icon.classList.add('text-pink-500', 'animate-pulse'); }
        const nameEl = li.querySelector('.text-gray-700, .text-gray-200');
        if (nameEl) { nameEl.classList.remove('text-gray-700', 'dark:text-gray-200'); nameEl.classList.add('text-pink-600', 'dark:text-pink-400'); }
      } else {
        li.classList.remove('bg-pink-50', 'dark:bg-pink-900/10', 'border-pink-500');
        li.classList.add('border-transparent');
        if (!li.classList.contains('hover:bg-gray-50')) li.classList.add('hover:bg-gray-50', 'dark:hover:bg-gray-800/50');
        const icon = li.querySelector('svg');
        if (icon) { icon.classList.add('text-gray-300', 'dark:text-gray-600'); icon.classList.remove('text-pink-500', 'animate-pulse'); }
        const nameEl = li.querySelector('.text-pink-600, .dark\\:text-pink-400');
        if (nameEl) { nameEl.classList.remove('text-pink-600', 'dark:text-pink-400'); nameEl.classList.add('text-gray-700', 'dark:text-gray-200'); }
      }
    });
  }

  function highlightCurrentFolder() {
    if (!currentFolder) return;
    $$('#folderList > li').forEach(li => {
      const hasActive = li.querySelector('.text-pink-600, .dark\\:text-pink-400');
      if (li.innerText.includes(currentFolder.name) || li.innerText.includes(currentFolder.title)) {
        li.classList.add('bg-pink-50/50', 'dark:bg-pink-900/10', 'border-pink-200', 'dark:border-pink-800');
        li.classList.remove('border-transparent');
      } else {
        li.classList.remove('bg-pink-50/50', 'dark:bg-pink-900/10', 'border-pink-200', 'dark:border-pink-800');
        li.classList.add('border-transparent');
      }
    });
  }

  /* ======== 自动播放下一首 ======== */
  function playNextMedia() {
    if (currentMediaList.length > 0 && currentMediaIndex + 1 < currentMediaList.length) {
      currentMediaIndex++;
      playMedia(currentFolder, currentMediaList[currentMediaIndex]);
    } else {
      // 尝试下一章
      const lis = $$('#folderList > li');
      let found = false;
      lis.forEach((li, i) => {
        if (!found && li.classList.contains('border-pink-200') || li.classList.contains('dark:border-pink-800')) {
          const next = lis[i + 1];
          if (next) {
            found = true;
            next.click();
            setTimeout(() => {
              const mediaLis = $$('#mediaList li');
              if (mediaLis.length > 0) mediaLis[0].click();
            }, 400);
          }
        }
      });
      if (!found) showToast('🎉 全部播放完毕');
    }
  }

  /* ======== 启动 ======== */
  loadFolders(currentPage);
})();
</script>
</body>
